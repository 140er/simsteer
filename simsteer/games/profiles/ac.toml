# Assetto Corsa. docs/PROFILES.md describes every key.
id = "ac"
display_name = "Assetto Corsa"
process_names = ["acs.exe"]
steam_app_id = 244210
tested = true

[telemetry]
kind = "ac_shm"

[controller]
# AC has no wheel angle, so the adapter derives one from yaw rate with
# this wheelbase and the controller inverts it with the same value. It
# scales the fit, not the steering; 4.0 keeps the seeds below valid.
wheelbase_m = 4.0
lookahead_s = 0.3

[camera]
hint = "Cockpit view"

[capabilities]
longitudinal = true
speed_source = "telemetry"
synth_wheel_angle = true
passive_fit_safe = true

[liveparams.gates]
profile = "loose"

[liveparams.gamepad]
seed = [3.0, 0.0010, 0.0]

[liveparams.wheel]
seed = [3.0, 0.0010, 0.0]
